<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rhythm Rush</title>
    <meta name="description" content="Log in or create a Rhythm Rush account.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="auth-view">
        <div class="auth-card">
            <span class="hero-badge">RHYTHM ARCADE</span>
            <h1>Welcome to Rhythm Rush</h1>
            <p>Log in to access your dashboard, save scores, and appear on the leaderboard.</p>

            <form id="loginForm" class="auth-form">
                <label>
                    <span>Username</span>
                    <input id="loginUsername" type="text" maxlength="20" required autocomplete="username">
                </label>
                <label>
                    <span>Password</span>
                    <input id="loginPassword" type="password" minlength="6" required autocomplete="current-password">
                </label>
                <div class="auth-actions">
                    <button class="btn-primary" type="submit">Log In</button>
                    <button class="btn-secondary" type="button" id="signupButton">Sign Up</button>
                </div>
                <p id="loginMessage" class="account-message" role="status"></p>
            </form>

            <a href="index.html" class="nav-link">Back to home</a>
        </div>
    </main>

    <script src="DataBase.js"></script>
    <script>
        async function authenticate(action) {
            const message = document.getElementById("loginMessage");
            const username = document.getElementById("loginUsername").value;
            const password = document.getElementById("loginPassword").value;

            try {
                if (action === "signup") await RhythmDB.createAccount(username, password);
                else await RhythmDB.login(username, password);
                window.location.href = "Dashboard.html";
            } catch (error) {
                message.innerText = error.message;
            }
        }

        document.getElementById("loginForm").addEventListener("submit", event => {
            event.preventDefault();
            authenticate("login");
        });
        document.getElementById("signupButton").addEventListener("click", () => authenticate("signup"));
    </script>
</body>

</html>
