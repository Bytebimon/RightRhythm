<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Maker - Rhythm Rush</title>
    <link rel="stylesheet" href="style.css">
    <script src="chart-utils.js"></script>
</head>

<body>
    <main class="container song-maker">
        <div class="header">
            <div>
                <h1>Song Maker</h1>
                <p>Create a chart, assign every note to a lane, and export it for the game.</p>
            </div>
            <a href="Dashboard.html" class="btn-secondary">Dashboard</a>
        </div>

        <section class="song-maker-panel">
            <div class="song-maker-fields">
                <label>Song title<input id="songTitle" value="My Rhythm Song"></label>
                <label>Artist<input id="songArtist" value="Player"></label>
                <label>BPM<input id="songBpm" type="number" min="40" max="300" value="120"></label>
                <label>Difficulty
                    <input id="songDifficulty" type="range" min="1" max="10" value="5">
                    <output id="difficultyValue">5 / 10</output>
                </label>
            </div>

            <label class="audio-upload">Upload MIDI file (note source)
                <input id="midiFile" type="file" accept="audio/midi,audio/mid,.mid,.midi">
            </label>
            <label class="audio-upload">Upload WAV audio
                <input id="audioFile" type="file" accept="audio/wav,audio/x-wav,.wav">
            </label>
            <audio id="audioPreview" controls hidden></audio>
            <button class="btn-primary" id="convertFiles" type="button" disabled>Convert MIDI + WAV</button>

            <div class="maker-actions">
                <button class="btn-primary" id="downloadChart">Download JSON</button>
                <button class="btn-secondary" id="copyChart">Copy JSON</button>
                <button class="btn-secondary" id="clearChart">Clear Notes</button>
                <label class="upload-label">Import JSON<input id="importChart" type="file" accept=".json" hidden></label>
            </div>

            <p id="makerStatus" class="account-message" role="status"></p>
            <ol id="makerNotes" class="maker-notes"></ol>
            <textarea id="chartOutput" class="chart-output" spellcheck="false" aria-label="Chart JSON"></textarea>
        </section>
    </main>

    <script>
        let notes = [];
        let audioData = "";
        let audioFileName = "";
        let midiData = null;
        let midiFileName = "";

        function makeChart() {
            return normalizeChart({
                id: `custom_${Date.now()}`,
                songTitle: document.getElementById("songTitle").value.trim() || "Untitled Song",
                artist: document.getElementById("songArtist").value.trim() || "Player",
                bpm: Number(document.getElementById("songBpm").value) || 120,
                difficulty: `${document.getElementById("songDifficulty").value}/10`,
                audioData,
                audioFileName,
                midiFileName,
                notes
            });
        }

        function refreshMaker() {
            const chart = makeChart();
            notes = chart.notes;
            document.getElementById("chartOutput").value = JSON.stringify(chart, null, 2);
            document.getElementById("makerNotes").innerHTML = notes.length
                ? notes.map((note, index) => `<li><span>${index + 1}. ${note.letter} at ${note.targetTime}ms</span><button type="button" data-remove="${index}">Remove</button></li>`).join("")
                : "<li class=\"leaderboard-empty\">No notes yet.</li>";
        }

        document.getElementById("makerNotes").addEventListener("click", event => {
            const index = event.target.dataset.remove;
            if (index !== undefined) {
                notes.splice(Number(index), 1);
                refreshMaker();
            }
        });
        document.getElementById("clearChart").addEventListener("click", () => {
            notes = [];
            refreshMaker();
        });
        document.getElementById("songDifficulty").addEventListener("input", event => {
            document.getElementById("difficultyValue").value = `${event.target.value} / 10`;
            document.getElementById("difficultyValue").innerText = `${event.target.value} / 10`;
            refreshMaker();
        });
        document.getElementById("audioFile").addEventListener("change", event => {
            const file = event.target.files[0];
            if (!file) return;
            audioFileName = file.name;
            const reader = new FileReader();
            reader.onload = () => {
                audioData = reader.result;
                const preview = document.getElementById("audioPreview");
                preview.src = audioData;
                preview.hidden = false;
                document.getElementById("makerStatus").innerText = `${file.name} loaded.`;
                document.getElementById("convertFiles").disabled = !midiData;
                refreshMaker();
            };
            reader.readAsDataURL(file);
        });
        document.getElementById("midiFile").addEventListener("change", async event => {
            const file = event.target.files[0];
            if (!file) return;
            midiFileName = file.name;
            midiData = await file.arrayBuffer();
            document.getElementById("convertFiles").disabled = false;
            document.getElementById("makerStatus").innerText = `${file.name} loaded. Add WAV too for song playback.`;
        });
        document.getElementById("convertFiles").addEventListener("click", () => {
            if (!midiData) return;
            try {
                const chart = parseMidiChart(midiData, {
                    songTitle: document.getElementById("songTitle").value,
                    artist: document.getElementById("songArtist").value,
                    difficulty: `${document.getElementById("songDifficulty").value}/10`,
                    audioData,
                    audioFileName
                });
                notes = chart.notes;
                document.getElementById("songBpm").value = chart.bpm;
                document.getElementById("makerStatus").innerText = `Converted ${notes.length} exact MIDI notes.`;
            } catch (error) {
                document.getElementById("makerStatus").innerText = error.message;
            }
            refreshMaker();
        });
        document.getElementById("downloadChart").addEventListener("click", () => {
            const blob = new Blob([JSON.stringify(makeChart(), null, 2)], { type: "application/json" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${(document.getElementById("songTitle").value || "custom-song").replace(/[^a-z0-9_-]/gi, "-")}.json`;
            link.click();
            URL.revokeObjectURL(link.href);
        });
        document.getElementById("copyChart").addEventListener("click", async () => {
            await navigator.clipboard.writeText(JSON.stringify(makeChart(), null, 2));
            document.getElementById("makerStatus").innerText = "Chart JSON copied.";
        });
        document.getElementById("importChart").addEventListener("change", event => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const chart = normalizeChart(JSON.parse(reader.result));
                    document.getElementById("songTitle").value = chart.songTitle || "Imported Song";
                    document.getElementById("songArtist").value = chart.artist || "Player";
                    document.getElementById("songBpm").value = chart.bpm || 120;
                    const difficulty = Number.parseInt(String(chart.difficulty || "5"), 10) || 5;
                    document.getElementById("songDifficulty").value = Math.max(1, Math.min(10, difficulty));
                    document.getElementById("difficultyValue").value = `${document.getElementById("songDifficulty").value} / 10`;
                    document.getElementById("difficultyValue").innerText = `${document.getElementById("songDifficulty").value} / 10`;
                    audioData = chart.audioData || "";
                    audioFileName = chart.audioFileName || "";
                    if (audioData) {
                        document.getElementById("audioPreview").src = audioData;
                        document.getElementById("audioPreview").hidden = false;
                    }
                    midiFileName = chart.midiFileName || "";
                    notes = chart.notes;
                    refreshMaker();
                    document.getElementById("makerStatus").innerText = "Chart imported.";
                } catch (error) {
                    document.getElementById("makerStatus").innerText = "That file is not valid chart JSON.";
                }
            };
            reader.readAsText(file);
        });
        refreshMaker();
    </script>
</body>

</html>
